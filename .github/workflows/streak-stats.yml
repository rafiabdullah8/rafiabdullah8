
name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=rafiabdullah8&theme=transparent&hide_border=true&background=100C14&ring=FB7185&fire=E879F9&currStreakLabel=FB7185&sideLabels=FDA4AF&currStreakNum=FCE7F3&sideNums=E879F9&dates=9D8FA3
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update GitHub streak stats" || exit 0
          git push
